 <path d="M370 380 C540 95 680 120 840 155 S1060 235 1230 15" fill="none" stroke="url(#beam)" stroke-width="38" stroke-linecap="round" stroke-dasharray="1 13" opacity=".8"/>
 <path d="M650 365 C760 190 950 110 1230 40" fill="none" stroke="#c8fbff" stroke-width="2" opacity=".6"/>
 <circle cx="1100" cy="55" r="145" fill="none" stroke="#b4f8ff" stroke-width="2" opacity=".48"/>
 <circle cx="1100" cy="55" r="118" fill="none" stroke="#b4f8ff" stroke-width="10" stroke-dasharray="3 12" opacity=".4"/>
 <g transform="translate(66 66)">
  <rect width="6" height="170" rx="3" fill="url(#beam)"/>
  <text x="28" y="12" fill="#c7faff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="5">SOFTWARE · AI · WEB3</text>
  <text x="24" y="78" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" letter-spacing="-2">TATAS HANDHARU</text>
  <text x="28" y="119" fill="#e4faff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600">Turning ideas into things that work.</text>
  <g transform="translate(28 146)" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">
   <rect width="126" height="31" rx="15" fill="#fff" fill-opacity=".16" stroke="#b9faff" stroke-opacity=".65"/><text x="63" y="20" text-anchor="middle" fill="#fff">⌘ ENGINEERING</text>
   <rect x="137" width="86" height="31" rx="15" fill="#fff" fill-opacity=".16" stroke="#b9faff" stroke-opacity=".65"/><text x="180" y="20" text-anchor="middle" fill="#fff">✦ AI</text>
   <rect x="234" width="105" height="31" rx="15" fill="#fff" fill-opacity=".16" stroke="#b9faff" stroke-opacity=".65"/><text x="286" y="20" text-anchor="middle" fill="#fff">◈ WEB3</text>
  </g>
 </g>
 <path d="M760 300 C880 220 1000 260 1230 135" fill="none" stroke="#c8fbff" stroke-width="1" opacity=".45"/>
 <rect width="1200" height="340" fill="url(#micro)" opacity=".28"/>
