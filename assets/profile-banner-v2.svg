<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Tatas Handharu</title><desc id="desc">Vibrant blue, cyan and violet digital waves with Tatas Handharu's software, AI and Web3 identity.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061b55"/><stop offset=".48" stop-color="#006fe8"/><stop offset="1" stop-color="#00d5e8"/></linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63f4ff"/><stop offset=".5" stop-color="#9a83ff"/><stop offset="1" stop-color="#ff72cf"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#66eaff" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#d5fcff" opacity=".62"/></pattern>
 <pattern id="micro" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".26"/></pattern>
 <clipPath id="clip"><rect width="1200" height="340" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1200" height="340" fill="url(#bg)"/>
 <circle cx="1070" cy="80" r="260" fill="url(#orb)"/>
